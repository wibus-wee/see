      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
