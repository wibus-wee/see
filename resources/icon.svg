    <circle cx="566" cy="580" r="195" fill="none" stroke="#1A2370" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="566" cy="580" r="161" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>

    <!-- Liquid glass rim of the tile -->
