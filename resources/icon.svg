    <radialGradient id="bgDeep" cx="820" cy="900" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A3CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7A3CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
