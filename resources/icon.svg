      <g transform="translate(566 580) scale(1.3) translate(-566 -580)">
        <g transform="translate(196 196) rotate(-7 210 270)">
          <use xlink:href="#code"/>
        </g>
      </g>
      <use xlink:href="#lensShape" fill="url(#lens)"/>
      <!-- specular highlight -->
      <path d="M427.4 599.5 A140 140 0 0 1 536.9 443.1" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="648" cy="670" rx="56" ry="18" transform="rotate(-45 648 670)" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
