  <!-- Soft shadow under the tile, stacked since SVG filters are not drawn -->
  <g fill="#000000">
    <use xlink:href="#sq" transform="translate(512 530) scale(1.012) translate(-512 -512)" fill-opacity="0.06"/>
    <use xlink:href="#sq" transform="translate(512 524) scale(1.004) translate(-512 -512)" fill-opacity="0.08"/>
    <use xlink:href="#sq" transform="translate(0 6)" fill-opacity="0.12"/>
  </g>

  <g clip-path="url(#clipSq)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgDeep)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)"/>

    <!-- The page of source, tilted -->
    <g transform="translate(196 196) rotate(-7 210 270)">
      <rect x="18" y="34" width="420" height="540" rx="44" fill="#0A1260" fill-opacity="0.22"/>
      <rect x="10" y="20" width="420" height="540" rx="44" fill="#0A1260" fill-opacity="0.18"/>
