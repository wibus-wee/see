name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag and version
        run: |
          version=$(jq -er '.version | select(type == "string" and length > 0)' mygo.json)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must match mygo.json version: v$version" >&2; exit 1; }

  build:
    needs: check
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/arm64,darwin/amd64
            files: |
              build/*/*.dmg
              build/*/*.tar.gz
              build/*/*.delta
              build/*/update-*.json
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64
            files: |
              build/*/*-setup-*.exe
              build/*/*.tar.gz
              build/*/*.delta
              build/*/update-*.json
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
            files: |
              build/*/*.deb
              build/*/*.tar.gz
              build/*/*.delta
              build/*/update-*.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build packages
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo 'Missing MYGO_UPDATER_PRIVATE_KEY secret' >&2; exit 1; }
          go tool mygo build -platform '${{ matrix.platform }}'
      - name: Verify packages
        env:
          PLATFORM_NAME: ${{ matrix.name }}
        run: |
          for arch in amd64 arm64; do
            case "$PLATFORM_NAME" in
              macOS) patterns=("build/darwin-$arch/*.dmg") ;;
              Windows) patterns=("build/windows-$arch/*-setup-*.exe") ;;
              Linux) patterns=("build/linux-$arch/*.deb" "build/linux-$arch/*.tar.gz") ;;
            esac
            for pattern in "${patterns[@]}"; do
              compgen -G "$pattern" > /dev/null || { echo "Missing package: $pattern" >&2; exit 1; }
            done
            case "$PLATFORM_NAME" in macOS) os=darwin ;; Windows) os=windows ;; Linux) os=linux ;; esac
            test -f "build/$os-$arch/update-$os-$arch.json" || { echo "Missing update manifest for $os/$arch" >&2; exit 1; }
            compgen -G "build/$os-$arch/*-$os-$arch.tar.gz" > /dev/null || { echo "Missing update archive for $os/$arch" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || { echo 'Release already published; refusing to replace assets' >&2; exit 1; }
          else
            args=(--draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
          mapfile -d '' files < <(find artifacts -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${files[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
