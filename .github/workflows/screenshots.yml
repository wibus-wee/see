name: Screenshots

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:  # temporary, while the pipeline is validated in #157

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@v0.24.0
      - name: Build See with automation
        run: go build -tags e2e -o build/see-e2e .
      - name: Install Pillow
        run: pip3 install --user --break-system-packages pillow
      - name: Display information
        run: system_profiler SPDisplaysDataType || true
      - name: Try a HiDPI display mode
        run: |
          brew install displayplacer || true
          displayplacer list || true
          # The runner's VM display is 1024x768@1x by default; a larger
          # HiDPI mode gives the hero room and retina density. The mode
          # below may not exist — the list above says what does.
          displayplacer "id:1 res:1920x1080 hz:60 color_depth:7 scaling:off origin:(0,0) degree:0" || true
          system_profiler SPDisplaysDataType || true
      - name: Set a desktop picture
        run: |
          python3 scripts/screenshots/shots.py wallpaper /tmp/wallpaper.png
          osascript -e 'tell application "System Events" to set picture of every desktop to POSIX file "/tmp/wallpaper.png"' || true
      - name: Capture the scenes
        run: python3 scripts/screenshots/shots.py capture --see build/see-e2e --out shots --hero-screencapture
      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error

  update:
    needs: capture
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: shots
          path: shots
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert and place the screenshots
        run: |
          set -e
          mkdir -p website/shots
          hero=shots/hero-light-wallpaper.png
          test -f "$hero" || hero=shots/hero-light.png
          cwebp -q 90 "$hero" -o resources/screenshot.webp
          cp resources/screenshot.webp website/screenshot.webp
          # The native screen crops are what the screen really shows; the
          # automation captures stay as fallbacks.
          for scene in hero-dark diff gitlog; do
            png="shots/$scene-native.png"
            test -f "$png" || png="shots/$scene.png"
            test -f "$png" && cwebp -q 90 "$png" -o "website/shots/$scene.webp"
          done
      - name: Open the screenshots pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          branch=screenshots/update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet resources website; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git checkout -b "$branch"
          git add resources/screenshot.webp website/screenshot.webp website/shots/
          git commit -m "Update screenshots [skip ci]"
          git push -f origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "Pull request for $branch updated."
          else
            gh pr create --title "Update screenshots" \
              --body "Screenshots captured by the [screenshots workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
              --head "$branch"
          fi
